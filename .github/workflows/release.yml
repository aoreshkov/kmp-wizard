# Publishes the plugin to the JetBrains Marketplace when a GitHub Release is
# published (the draft-release gate — see .claude/skills/release/SKILL.md).
#
# PUBLISH_TOKEN (marketplace environment) is the only secret. Author-side
# plugin signing is deliberately omitted: JetBrains Marketplace does not
# support signature verification (staff statement, 2026-05 —
# https://platform.jetbrains.com/t/-/2584), so signPlugin would be a no-op.
# Revisit if JetBrains ever enables verification.
#
# Marketplace rejects duplicate versions, so an accidental re-run of an
# already-published version fails loudly instead of double-publishing.
name: Release

on:
  release:
    types: [released]

permissions:
  contents: write # upload the plugin ZIP as a release asset

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: marketplace
    steps:
      # The default ref on the release event is the release tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Publish plugin
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Attach plugin ZIP to the release
        run: gh release upload "$TAG_NAME" build/distributions/*.zip --clobber
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
