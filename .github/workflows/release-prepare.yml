# Stage 1 of a release (see .claude/skills/release/SKILL.md, step 9): builds and
# verifies the plugin from the exact commit a *draft* GitHub Release targets, signs
# a build-provenance attestation for the ZIP, and attaches the ZIP to the draft.
#
# Publishing the draft then fires release.yml, which re-verifies that attestation
# against the tag's commit and uploads that byte-identical ZIP to the Marketplace —
# nothing is rebuilt and nothing is uploaded to the release after it is published
# (GitHub's draft → attach → publish flow, compatible with immutable releases).
#
# No secrets: PUBLISH_TOKEN lives only in the marketplace environment, which this
# workflow never enters. Drafts accept re-uploads, so a re-run is safe.
name: Release (prepare)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to prepare (e.g. v1.10.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # draft releases are only visible to tokens with write access
    outputs:
      sha: ${{ steps.draft.outputs.sha }}
    steps:
      - name: Check the draft targets this run's commit
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag"; exit 1; }
          read -r is_draft target < <(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"')
          [[ "$is_draft" == true ]] || { echo "::error::$TAG is already published — published releases are not prepared again"; exit 1; }
          # A branch name would let GitHub tag whatever that branch points at on publish.
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Draft target '$target' is not a full commit SHA — create it with --target <sha>"; exit 1; }
          # The provenance attestation records this run's commit (GITHUB_SHA), and release.yml
          # matches it against the tag, so the ZIP must be built from exactly that commit.
          [[ "$target" == "$GITHUB_SHA" ]] || { echo "::error::Draft targets $target but this run is on $GITHUB_SHA ($GITHUB_REF) — dispatch from a ref whose HEAD is the draft's target"; exit 1; }
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify & build
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Check pluginVersion matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          [[ "v$version" == "$TAG" ]] || { echo "::error::gradle.properties pluginVersion=$version does not match $TAG"; exit 1; }

      # check includes verifyProductDescriptor; verifyPlugin covers IDEA and Android Studio.
      - name: Test, verify and build
        run: ./gradlew check verifyPlugin buildPlugin

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attest & attach to draft
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # upload the release asset
      id-token: write     # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      - name: Download plugin ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-distribution
          path: dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Attach ZIP to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # Re-check: the draft may have been published while this run was building.
          [[ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]] \
            || { echo "::error::$TAG was published before its ZIP was attached"; exit 1; }
          gh release upload "$TAG" dist/*.zip -R "$GITHUB_REPOSITORY" --clobber
