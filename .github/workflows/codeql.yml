name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "26 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # CodeQL manual build mode traces live compiler processes, so the compile
      # must actually execute: --no-build-cache prevents FROM-CACHE outcomes from
      # the cache shared with the Build workflow, --no-configuration-cache avoids
      # config-cache reuse bypassing the tracer env, --no-daemon keeps compilation
      # in a freshly spawned traced process. The CodeQL extractor runs inside the
      # Kotlin compiler JVM and OOMs the default daemon heap, so compile in-process
      # with an explicit 4g heap. compileKotlin only: skipping processResources
      # avoids the kmp-ledger download + template generation.
      - name: Compile for CodeQL
        run: >
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          -Dorg.gradle.jvmargs=-Xmx4g
          -Pkotlin.compiler.execution.strategy=in-process
          compileKotlin

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:java-kotlin"
