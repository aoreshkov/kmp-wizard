version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      # CodeQL's Kotlin extractor trails Kotlin releases by ~21-35 days (2.3.20:
      # 30d, 2.4.0: 35d, 2.4.10: ~3w) and hard-errors on anything newer, so the
      # CodeQL workflow cannot compile a too-new Kotlin at all. Bumping sooner
      # just parks a red PR until the next CodeQL CLI release. Kotlin's .10/.20
      # releases are semver-patch bumps relative to each other, hence patch-days.
      # Scoped via include so the rest of the Gradle deps keep the 3-day default.
      semver-patch-days: 30
      semver-minor-days: 30
      include:
        - "org.jetbrains.kotlin*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # github/codeql-action/{init,analyze} are separate Dependabot dependencies
      # but must move together: analyze hard-errors when it loads a config
      # written by a different init version. Ungrouped, each sub-action gets its
      # own PR that can never go green. No update-types filter — a filter would
      # push major bumps back out of the group and re-create the split.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # groups default to applies-to: version-updates, so a security advisory
      # would otherwise be ungrouped and split again.
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
