<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#7F52FF"/>
            <stop offset="100%" style="stop-color:#E44857"/>
        </linearGradient>
    </defs>
    <!-- Background: M3 Surface Container High, lightened so the tile reads on dark IDE/Marketplace chrome -->
    <rect width="40" height="40" rx="12" fill="#2B2D30"/>

    <!-- Data Layer (Foundation - Widest) -->
    <rect x="6" y="26" width="28" height="4" rx="2" fill="url(#grad1)" opacity="0.4"/>

    <!-- Domain Layer (Middle) -->
