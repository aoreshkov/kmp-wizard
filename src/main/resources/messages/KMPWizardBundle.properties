# User-facing strings for the KMP Project Wizard.
# Messages that take {0} parameters must escape literal single quotes by doubling them.

wizard.name=KMP Project

# Display name of the balloon notification group (Settings | Notifications).
notification.group.name=KMP Project Wizard

settings.package.label=Package name:
settings.package.comment=E.g. com.example.myapp
settings.package.error.empty=Package name must not be empty
settings.package.error.invalid=Must be a valid package name (e.g. com.example.myapp)

settings.feature.label=Feature name:
settings.feature.comment=Lower-case name of the primary feature module
settings.feature.error.empty=Feature name must not be empty

settings.field.label=Field name:
settings.field.comment=Lower-case name of the primary data field
settings.field.error.empty=Field name must not be empty

settings.identifier.error.charset=Use lowercase letters, digits, and underscores only

settings.testValue.label=Test value name:
settings.testValue.comment=Sample value used in generated tests
settings.testValue.error.empty=Test value name must not be empty

platforms.group=Target Platforms
platforms.android=Android
platforms.desktop=Desktop (JVM)
platforms.ios=iOS
platforms.error.none=Select at least one target platform.

pro.group=Pro
pro.agentConfig=AI agent config (CLAUDE.md, .claude/)
pro.ci=CI workflows (.github/)
pro.locked.hint=These require a Pro license.
pro.locked.cta=Get a license

# Android Studio path. Studio owns its first page (project name, package, save location)
# and renders parameter names as plain labels, so these carry no trailing colons and
# there are no package/name entries here.
studio.template.name=KMP Project
studio.template.description=Generates an opinionated Kotlin Multiplatform project targeting Android, Desktop (JVM) and iOS, with Compose Multiplatform, Navigation 3, Room 3, Koin and a full test suite.
studio.param.feature=Feature name
studio.param.field=Field name
studio.param.testValue=Test value name
studio.platforms.hint=Target platforms (select at least one — Android is used if none is)
# Unlike the IDEA form, a LabelWidget cannot be hidden once the user is licensed, so this
# reads as a section header for both states rather than as a "you need a license" notice.
studio.pro.hint=Pro features — enabled with a Pro license
studio.pro.link=Learn about Pro
# No {0} parameter here, so MessageFormat never runs and the quote must NOT be doubled.
studio.notify.cleanup.failed=Could not remove Android Studio's default project files. Delete the project directory and try again.

progress.generating=Generating KMP project ''{0}''…
notify.success.title=Project generated
notify.success.content=KMP Project ''{0}'' was created successfully.
notify.failure.title=Project generation failed
notify.failure.content=Error creating project: {0}
notify.apiDump.failure.title=API dumps not generated
notify.apiDump.failure.content=Could not generate the binary compatibility dumps. Run './gradlew apiDump' in the project to create them.
