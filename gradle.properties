# Plugin version
pluginVersion=1.5.0

# kmp-ledger release tag (without the leading 'v') whose GitHub source archive
# the templates are generated from. Never re-tag the ledger — always bump this
# (Gradle caches static versions forever).
ledgerVersion=1.6.2

# Project coordinates
group=app.oreshkov.kmp
pluginId=app.oreshkov.kmp.wizard

# Author info
vendorName=Atanas Oreshkov
vendorEmail=kmpwizard@oreshkov.app
vendorUrl=https://kmpwizard.oreshkov.app/

# Don't bundle kotlin-stdlib into the plugin — the IntelliJ Platform provides it
# at runtime, and bundling it risks a version clash.
kotlin.stdlib.default.dependency=false

# Build performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

