[versions]
kotlin               = "2.4.21"
intellij-platform   = "2.20.1"
# Compile against the LOWEST supported IDE, not the newest: the Plugin Verifier
# flags any API introduced after sinceBuild, and Android Studio trails IntelliJ
# IDEA by a full branch (see intellij-since-build).
intellij-ide        = "2026.1"
# 261, not 262, because Android Studio trails IntelliJ IDEA by a branch: Quail
# (2026.1.x) is AI-261, and Quail 2 is the oldest Android Studio that opens the
# projects ledger v1.11.0 generates (AGP 9.3.3). Stable Android Studio reached 262
# with Rabbit (2026.2, Oct 2026); raise this floor only once dropping every Quail
# user is acceptable.
intellij-since-build = "261"
# Marketplace org.jetbrains.android, needed for the Android Studio wizard path
# (com.android.tools.idea.wizard.template). Not a bundled plugin: the unified
# IntelliJ IDEA distribution ships only android-gradle-dsl, so the real Android
# plugin is resolved from the Marketplace. Keep this an EXACT build match for
# intellij-ide — 2026.1 is IU-261.22158.277 — or the sandbox IDE refuses to load it.
android-plugin       = "261.22158.277"
# Android Studio releases the Plugin Verifier checks (verifyPlugin) — recommended()
# never selects Android Studio. Bump manually from the Android Studio releases list
# (plugins.jetbrains.com/docs/intellij/android-studio-releases-list.html): "stable" =
# newest stable release, "next" = newest build on the following branch (canary/RC).
android-studio-stable = "2026.2.2.10"
android-studio-next   = "2026.3.1.2"
changelog            = "2.5.0"
junit               = "4.13.2"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlin-jvm        = { id = "org.jetbrains.kotlin.jvm",       version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
changelog         = { id = "org.jetbrains.changelog",         version.ref = "changelog" }