[versions]
kotlin               = "2.4.10"
intellij-platform   = "2.18.1"
# Compile against the LOWEST supported IDE, not the newest: the Plugin Verifier
# flags any API introduced after sinceBuild, and Android Studio trails IntelliJ
# IDEA by a full branch (see intellij-since-build).
intellij-ide        = "2026.1"
# 261, not 262, because Android Studio is a branch behind: the newest Android
# Studio on ANY channel (Quail 4 canary, 2026-07-23) is still AI-261.26222.65, so
# a 262 floor makes the plugin uninstallable in every existing Android Studio.
# Quail's bundled Android tooling is AGP 9.3.1 (libagp-version.jar), well above
# the ledger's 9.1.1, so the 1.6.1 AGP-compatibility fix is unaffected.
intellij-since-build = "261"
# Marketplace org.jetbrains.android, needed for the Android Studio wizard path
# (com.android.tools.idea.wizard.template). Not a bundled plugin: the unified
# IntelliJ IDEA distribution ships only android-gradle-dsl, so the real Android
# plugin is resolved from the Marketplace. Keep this an EXACT build match for
# intellij-ide — 2026.1 is IU-261.22158.277 — or the sandbox IDE refuses to load it.
android-plugin       = "261.22158.277"
changelog            = "2.5.0"
junit               = "4.13.2"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlin-jvm        = { id = "org.jetbrains.kotlin.jvm",       version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
changelog         = { id = "org.jetbrains.changelog",         version.ref = "changelog" }